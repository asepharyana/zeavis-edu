# $api_upstream is defined in 00-upstream.conf inside the image. It is a VARIABLE
# on purpose: nginx resolves a literal proxy_pass hostname at startup and refuses
# to boot when it is absent, which makes this image depend on the api container
# already existing. With a variable, resolution happens per request.
server {
  listen 80;
  server_name _;

  # Must be declared inside the server block; see 00-upstream.conf in the image.
  set $api_upstream zeavis-api:4006;
  root /var/lib/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://$api_upstream/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Expose API metrics through the web endpoint (Prometheus scrape target)
  location /metrics {
    proxy_pass http://$api_upstream/metrics;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
