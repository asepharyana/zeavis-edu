tasks:
  dev:
    command: pnpm run dev
  # The API ships TypeScript source — tsx transpiles it at runtime, so there is
  # no bundle to emit and no `dist` to declare. The build task is the compile gate.
  build:
    command: pnpm run build
    deps:
      - shared:build
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - drizzle.config.ts
  typecheck:
    command: pnpm run typecheck
    deps:
      - shared:typecheck
    inputs:
      - src/**/*
      - package.json
      - tsconfig.json
      - drizzle.config.ts
