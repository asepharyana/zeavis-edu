name: Build & Deploy (pnpm)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zeavis-deploy
  cancel-in-progress: false

# No `id-token: write`: it only ever served the FlakeHub publish step, which
# lives in flakehub-publish-rolling.yaml. There is no Nix anywhere in here.
permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      # Version comes from `packageManager` in package.json (pnpm@10.33.2).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 24 to match the VPS (node v24.21.0)
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ml-service:typecheck is `cargo check` (Rust) and is out of scope for
      # this pnpm workspace — see the note on the deploy matrix below.
      - name: Typecheck
        run: pnpm exec moon run shared:typecheck api:typecheck web:typecheck

      - name: Test
        run: pnpm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # zeavis-ml-service is intentionally absent: it is a Rust/onnx binary
        # whose launcher (/opt/zeavis-ml-service/bin/zeavis-ml-service) still
        # points at a deleted /nix/store path, so it cannot be restarted, let
        # alone rebuilt, from this pnpm tree. Re-add it only once that binary is
        # produced by a cargo build and shipped separately.
        service: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false


      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The script is shipped from THIS checkout so the deploy logic always
      # matches the commit being released, then runs on the box: clone the sha,
      # pnpm install --frozen-lockfile, atomically flip the live path, restart
      # the unit, health-check, and roll back if the check fails.
      - name: Copy deploy script to VPS
        run: scp -o BatchMode=yes scripts/deploy-direct.sh "$VPS_USER@$VPS_HOST:/tmp/zeavis-deploy-direct.sh"

      - name: Deploy zeavis-${{ matrix.service }} to VPS
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "bash /tmp/zeavis-deploy-direct.sh '${{ matrix.service }}' '$DEPLOY_SHA' '$DEPLOY_REF'"

      - name: Journal on failure
        if: failure()
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          echo "=== deploy of ${{ matrix.service }} @ $DEPLOY_SHA failed - journal ==="
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "systemctl status zeavis-${{ matrix.service }} --no-pager 2>&1 | head -20; journalctl -u zeavis-${{ matrix.service }} -n 60 --no-pager" \
            || true