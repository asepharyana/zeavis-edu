name: Publish to FlakeHub

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  flakehub-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-push@v7
        with:
          visibility: public
          rolling: true
